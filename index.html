<!DOCTYPE html>
<!-- v2.0 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PSY LOOPER PRO</title>
<style>
:root{
--bg:#0a0a0f;--panel:#14141a;--panel2:#1c1c24;--panel3:#222230;
--border:#2a2a35;--border2:#3a3a45;
--text:#e0e0e8;--text2:#686878;--text3:#484858;
--accent:#00e676;--accent2:#00e67633;--accent3:#00e67618;
--warn:#ff6b35;--err:#ff3d5a;--info:#4dabf7;
--mono:'SF Mono','Cascadia Code','Courier New',monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:12px}
button{cursor:pointer;font-family:var(--sans);border:none;outline:none}
select,input{font-family:var(--sans);outline:none}
.app{display:flex;flex-direction:column;height:100vh}

/* HEADER */
.hd{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd-left{display:flex;align-items:center;gap:16px}
.logo{font-size:13px;font-weight:600;letter-spacing:2px;color:var(--text)}
.logo span{color:var(--accent);font-weight:300}
.ver{font-size:9px;color:var(--text3);font-family:var(--mono)}
.transport{display:flex;align-items:center;gap:8px}
.bpm-box{font-family:var(--mono);font-size:14px;color:var(--accent);background:var(--bg);border:1px solid var(--border);padding:4px 10px;min-width:60px;text-align:center}
.btn{padding:5px 12px;border-radius:3px;background:var(--panel2);color:var(--text);font-size:10px;letter-spacing:0.5px;transition:all 80ms ease;border:1px solid var(--border)}
.btn:hover{border-color:var(--border2);background:var(--panel3)}
.btn:active{transform:scale(0.96)}
.btn-play{min-width:70px;font-family:var(--mono);font-size:11px}
.btn-play.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn-rec{min-width:60px;font-family:var(--mono);font-size:11px}
.btn-rec.active{background:var(--err);color:#fff;border-color:var(--err)}
.btn-sm{padding:4px 8px;font-size:9px}
.btn-accent{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}
.btn-accent:hover{background:#00c866}

/* MAIN LAYOUT */
.main{flex:1;display:grid;grid-template-columns:220px 1fr 240px;gap:1px;background:var(--border);overflow:hidden}
.col{background:var(--panel);overflow-y:auto;padding:12px}
.col::-webkit-scrollbar{width:4px}
.col::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.col-center{background:var(--bg);padding:12px;overflow-y:auto}
.col-right{border-left:1px solid var(--border)}
.col-left{border-right:1px solid var(--border)}

/* SECTION HEADERS */
.sec{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sec:first-child{margin-top:0}

/* BANKS */
.banks-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.bank{padding:10px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:3px;text-align:center;cursor:pointer;transition:all 120ms ease;position:relative}
.bank:hover{border-color:var(--border2)}
.bank.active{border-color:var(--accent);box-shadow:0 0 8px var(--accent3)}
.bank .num{font-family:var(--mono);font-size:13px;color:var(--text2)}
.bank.active .num{color:var(--accent)}
.bank.loaded::after{content:'';position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

/* WAVEFORM */
.wave-wrap{background:var(--bg);border:1px solid var(--border);border-radius:4px;height:110px;position:relative;overflow:hidden;margin-bottom:12px}
.wave-wrap canvas{width:100%;height:100%;display:block}

/* PADS */
.pads-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:12px}
.pad{aspect-ratio:1;background:var(--panel2);border:1px solid var(--border);border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 60ms ease-out;font-family:var(--mono);font-size:10px;color:var(--text2)}
.pad:hover{border-color:var(--border2)}
.pad.hit{background:var(--accent);color:var(--bg);box-shadow:0 0 16px var(--accent2);transform:scale(0.93)}
.pad.off{opacity:0.2;pointer-events:none}

/* SEQUENCER */
.seq-grid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-bottom:12px}
.sq{aspect-ratio:1;background:var(--panel2);border:1px solid var(--border);border-radius:2px;cursor:pointer;transition:all 80ms linear}
.sq.on{background:var(--accent);border-color:var(--accent)}
.sq.play{border-color:var(--accent);box-shadow:0 0 8px var(--accent3)}

/* TOOLS */
.tools-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}

/* FX RACK */
.fx-card{background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:8px 10px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.fx-toggle{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;flex-shrink:0;transition:all 100ms}
.fx-toggle.on{background:var(--accent);box-shadow:0 0 6px var(--accent2)}
.fx-name{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text2);width:50px;flex-shrink:0}
.fx-card input[type=range]{flex:1;height:3px}

/* MACROS */
.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:12px}
.macro{padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:3px;text-align:center;cursor:pointer;transition:all 100ms;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.macro:hover{border-color:var(--border2);color:var(--text)}
.macro:active{transform:scale(0.96);border-color:var(--accent);color:var(--accent)}

/* SLIDERS */
.ctrl{margin-bottom:8px}
.ctrl label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:0.5px;color:var(--text2);margin-bottom:4px}
.ctrl label span{font-family:var(--mono);color:var(--accent);font-size:10px}
input[type=range]{width:100%;height:3px;-webkit-appearance:none;background:var(--border);border-radius:2px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--accent);border-radius:50%;cursor:pointer}
select{width:100%;padding:5px 8px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:3px;font-size:10px;cursor:pointer}

/* LIBRARY */
.lib-item{background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:6px 10px;margin-bottom:3px;cursor:pointer;transition:all 100ms;display:flex;justify-content:space-between;align-items:center}
.lib-item:hover{border-color:var(--accent)}
.lib-item .name{font-size:10px;color:var(--text)}
.lib-item .tag{font-size:8px;font-family:var(--mono);color:var(--text3);background:var(--bg);padding:2px 5px;border-radius:2px}

/* GEN */
.gen-row{display:flex;gap:4px;margin-bottom:4px}
.gen-row select{flex:1}

/* XY PAD */
.xy-pad{width:100%;aspect-ratio:1;background:var(--panel2);border:1px solid var(--border);border-radius:4px;position:relative;cursor:crosshair;margin-bottom:12px}
.xy-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent2);transform:translate(-50%,-50%);pointer-events:none}

/* LFO */
.lfo-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.lfo-row select{width:60px}
.lfo-row input[type=range]{flex:1}
.lfo-row span{font-family:var(--mono);font-size:9px;color:var(--accent);min-width:35px}
.lfo-viz{height:20px;background:var(--panel2);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:12px}
.lfo-viz canvas{width:100%;height:100%;display:block}

/* LOG */
.log-bar{background:var(--panel);border-top:1px solid var(--border);padding:6px 16px;font-family:var(--mono);font-size:9px;color:var(--text3);display:flex;justify-content:space-between}
.log-bar .log-msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
.log-bar .log-msg.ok{color:var(--accent)}
.log-bar .log-msg.er{color:var(--err)}
.log-bar .log-msg.info{color:var(--info)}

/* METER */
.meter{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--warn),var(--err));width:0%;transition:width 40ms}

/* RESPONSIVE */
@media(max-width:1100px){.main{grid-template-columns:180px 1fr 200px}}
@media(max-width:800px){.main{grid-template-columns:1fr;grid-template-rows:auto auto auto}}
</style>

<script>
// === GLOBAL ERROR HANDLER ===
window.onerror = function(msg, url, line, col, error) {
    console.error('GLOBAL ERROR:', msg, 'at line', line);
    var el = document.getElementById('logEl');
    if (el) { el.textContent = '> ERROR: ' + msg; el.className = 'log-msg er'; }
    return false;
};
window.addEventListener('unhandledrejection', function(e) {
    console.error('UNHANDLED REJECTION:', e.reason);
});

// PSY LOOPER PRO - Clean Rebuild
console.log('PSY LOOPER: script loaded');

// === GLOBAL STATE ===
var AC=null,master=null,analyser=null;
var nFil=null,nHP=null,nDist=null,nComp=null,nSoft=null;
var nDel=null,nDelFb=null,nDelMix=null;
var nVerb=null,nVerbMix=null;
var srcs=[];

var S={
  bpm:145,swing:0,bank:0,playing:false,
  vol:0.8,sens:50,genType:"melodic",
  banks:[],
  fx:{filter:true,delay:false,reverb:false,dist:false},
  fxP:{filterF:12000,delayM:.3,reverbM:.25,distD:.3}
};

// Initialize banks
for(var bi=0;bi<8;bi++){S.banks.push({buf:null,slices:[],info:null,pitch:0,speed:1,atk:3,rel:60,rev:false});}

// === HELPERS ===
function $(id){return document.getElementById(id)}
function log(msg,type){
  var el=$("logEl");
  if(el){el.textContent="> "+msg;el.className="log-msg"+(type?" "+type:"")}
  console.log(msg);
}

// === MUSIC THEORY ===
var KEYS={C:60,"C#":61,D:62,"D#":63,E:64,F:65,"F#":66,G:67,"G#":68,A:69,"A#":70,B:71};
var SCALES={minor:[0,2,3,5,7,8,10],major:[0,2,4,5,7,9,11],phrygian:[0,1,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],mixolydian:[0,2,4,5,7,9,10]};
function m2f(m){return 440*Math.pow(2,(m-69)/12)}

// === AUDIO ENGINE ===
function mkDistCurve(k){
  var n=4096,c=new Float32Array(n);
  for(var i=0;i<n;i++){var x=i*2/n-1;c[i]=k===0?x:Math.tanh(x*k/10)*.9}
  return c;
}

function mkIR(sec,sr){
  var len=Math.floor(sec*sr),buf=AC.createBuffer(2,len,sr);
  for(var ch=0;ch<2;ch++){
    var d=buf.getChannelData(ch);
    var seed=12345+ch;
    for(var i=0;i<len;i++){
      seed=(seed*1664525+1013904223)&0xFFFFFFFF;
      d[i]=((seed>>>0)/4294967296*2-1)*Math.pow(1-i/len,2.5);
    }
  }
  return buf;
}

function initAudio(){
  if(AC)return true;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    var sr=AC.sampleRate;
    master=AC.createGain();master.gain.value=S.vol||0.8;
    analyser=AC.createAnalyser();analyser.fftSize=2048;
    nSoft=AC.createWaveShaper();nSoft.curve=mkDistCurve(0);
    nComp=AC.createDynamicsCompressor();
    nComp.threshold.value=-12;nComp.knee.value=10;nComp.ratio.value=4;
    nComp.attack.value=0.003;nComp.release.value=0.15;
    nFil=AC.createBiquadFilter();nFil.type="lowpass";nFil.frequency.value=12000;nFil.Q.value=0.7;
    nHP=AC.createBiquadFilter();nHP.type="highpass";nHP.frequency.value=25;nHP.Q.value=0.5;
    nDist=AC.createWaveShaper();nDist.curve=mkDistCurve(0);nDist.oversample="4x";
    nDel=AC.createDelay(2.0);nDel.delayTime.value=(60/S.bpm)*0.75;
    nDelFb=AC.createGain();nDelFb.gain.value=0.4;
    nDelMix=AC.createGain();nDelMix.gain.value=0;
    nDel.connect(nDelFb);nDelFb.connect(nDel);nDel.connect(nDelMix);
    nVerb=AC.createConvolver();nVerb.buffer=mkIR(2.5,sr);
    nVerbMix=AC.createGain();nVerbMix.gain.value=0;
    nVerb.connect(nVerbMix);
    // Chain: nHP->nFil->nDist->nComp->nSoft->master->analyser->out
    nHP.connect(nFil);nFil.connect(nDist);nDist.connect(nComp);
    nComp.connect(nSoft);nSoft.connect(master);master.connect(analyser);analyser.connect(AC.destination);
    nDelMix.connect(nHP);nVerbMix.connect(nHP);
    if(AC.state==='suspended'){AC.resume()}
    log("Audio ready @ "+sr+"Hz","ok");
    return true;
  }catch(e){
    log("Audio init error: "+e.message,"er");
    console.error("AUDIO INIT FAILED:",e);
    return false;
  }
}

function distCurve(k){return mkDistCurve(k)}

function applyFX(){
  if(!AC)return;
  if(nFil)nFil.frequency.setTargetAtTime(S.fx.filter?S.fxP.filterF:20000,AC.currentTime,.02);
  if(nDelMix)nDelMix.gain.setTargetAtTime(S.fx.delay?S.fxP.delayM:0,AC.currentTime,.02);
  if(nVerbMix)nVerbMix.gain.setTargetAtTime(S.fx.reverb?S.fxP.revM:0,AC.currentTime,.02);
  if(nDist)nDist.curve=mkDistCurve(S.fx.dist?S.fxP.distD*50:0);
  if(nDel)nDel.delayTime.setTargetAtTime((60/S.bpm)*0.75,AC.currentTime,.05);
}

// Auto-init audio on first interaction

// === ANALYSIS ===
function analyze(buf){
  if(!buf)return null;
  var d=buf.getChannelData(0),sr=buf.sampleRate;
  var sum=0,pk=0;
  for(var i=0;i<d.length;i++){sum+=d[i]*d[i];pk=Math.max(pk,Math.abs(d[i]))}
  var rms=Math.sqrt(sum/d.length);
  var hop=512,ens=[];
  for(i=0;i+hop<d.length;i+=hop){var e=0;for(var j=0;j<hop;j++)e+=d[i+j]*d[i+j];ens.push(e/hop)}
  var fps=sr/hop,best=145,bc=-1;
  for(var bpm=60;bpm<=200;bpm++){
    var lag=Math.round(60/bpm*fps);
    if(lag>=ens.length/2)continue;
    var c=0;for(i=0;i<ens.length-lag;i++)c+=ens[i]*ens[i+lag];
    if(c>bc){bc=c;best=bpm}
  }
  return{dur:buf.duration,rms:rms,peak:pk,tempo:best};
}

function sliceBuf(buf,sens){
  if(!buf)return[];
  var d=buf.getChannelData(0),sr=buf.sampleRate;
  var thr=1-(sens||50)/100;
  var hop=512,fr=1024,flux=[];
  for(var i=0;i+fr<d.length;i+=hop){var e=0;for(var j=0;j<fr;j++)e+=d[i+j]*d[i+j];flux.push(e/fr)}
  var mx=0;for(i=0;i<flux.length;i++)mx=Math.max(mx,flux[i]);
  if(mx===0)return[{i:0,s:0,e:d.length,d:buf.duration}];
  var th=mx*thr,pts=[0];
  for(i=1;i<flux.length-1;i++){
    if(flux[i]>th&&flux[i]>flux[i-1]&&flux[i]>=flux[i+1]){
      var pos=i*hop,zc=pos;
      for(j=pos;j<Math.min(pos+80,d.length-1);j++){if(d[j]*d[j+1]<=0){zc=j;break}}
      if(pts.length===0||zc-pts[pts.length-1]>sr*.05)pts.push(zc);
    }
  }
  while(pts.length>16){
    var mg=1e9,mi=1;
    for(i=1;i<pts.length;i++){var g=pts[i]-pts[i-1];if(g<mg){mg=g;mi=i}}
    pts.splice(mi,1);
  }
  var res=[];
  for(i=0;i<pts.length;i++){
    var end=i<pts.length-1?pts[i+1]:d.length;
    res.push({i:i,s:pts[i],e:end,d:(end-pts[i])/sr});
  }
  return res;
}

// === GENERATION ===
function genLoop(type,key,scale,bars,bpm){
  if(!AC&&!initAudio())return null;
  var sr=AC.sampleRate,beat=60/bpm,six=beat/4,N=Math.floor(bars*4*beat*sr);
  var out=new Float32Array(N);
  var root=KEYS[key]||69,sc=SCALES[scale]||SCALES.minor;
  var i,j,jj,f,t,env,osc,s,L;
  
  // === PROFESSIONAL SYNTHESIS ENGINE ===
  
  // Rich waveform generator (additive synthesis)
  function richWave(phase,brightness){
    var v=Math.sin(phase);
    v+=Math.sin(phase*2)*.5*brightness;
    v+=Math.sin(phase*3)*.33*brightness*brightness;
    v+=Math.sin(phase*4)*.25*brightness*brightness*brightness;
    v+=Math.sin(phase*5)*.2*brightness*brightness*brightness*brightness;
    return v/(1+.5*brightness+.33*brightness*brightness+.25*brightness*brightness*brightness+.2*brightness*brightness*brightness*brightness);
  }
  
  // ADSR envelope
  function adsr(t,atk,dec,sus,rel,dur){
    if(t<atk)return t/atk;
    if(t<atk+dec)return 1-(1-sus)*((t-atk)/dec);
    if(t<dur-rel)return sus;
    if(t<dur)return sus*(1-(t-(dur-rel))/rel);
    return 0;
  }
  
  // Filter envelope (opens then closes)
  function filterEnv(t,amount){
    var e=Math.exp(-t*3)*amount;
    return Math.min(1,.3+e);
  }
  
  if(type==="melodic"||type==="lead"){
    var pi=Math.floor(Math.random()*sc.length);
    var bright=type==="lead"?.8:.5;
    for(i=0;i<bars*16;i++){
      if(Math.random()<.7){
        pi=Math.max(0,Math.min(sc.length-1,pi+Math.floor(Math.random()*5)-2));
        f=m2f(root+12+sc[pi]);
        s=Math.floor(i*six*sr);L=Math.floor(six*(Math.random()<.3?2:1)*.9*sr);
        if(s+L>N)break;
        for(jj=0;jj<L&&s+jj<N;jj++){
          t=jj/sr;
          env=adsr(t,.008,.05,.7,.1,L/sr);
          var fe=filterEnv(t,.6);
          var phase=2*Math.PI*f*t;
          osc=richWave(phase,bright*fe);
          // Stereo detune for width
          var osc2=richWave(phase*1.003,bright*fe*.7);
          out[s+jj]+=(osc+osc2)*.5*env*.22;
        }
      }
    }
  }else if(type==="bass"){
    var pat=[0,0,12,0,0,0,12,3,0,0,12,0,0,3,12,0];
    for(i=0;i<bars*16;i++){
      s=Math.floor(i*six*sr);L=Math.floor(six*.8*sr);
      if(s+L>N)break;
      f=m2f(root-12+sc[pat[i%16]%sc.length]);
      for(jj=0;jj<L&&s+jj<N;jj++){
        t=jj/sr;
        env=adsr(t,.003,.03,.8,.05,L/sr);
        var fe=filterEnv(t,.8);
        var phase=2*Math.PI*f*t;
        // Rich bass: fundamental + harmonics + sub
        osc=richWave(phase,.6*fe);
        osc+=Math.sin(phase)*.4; // Extra fundamental
        osc+=Math.sin(phase*.5)*.3; // Sub octave
        out[s+jj]+=osc*env*.45;
      }
    }
  }else if(type==="rhythmic"||type==="percussion"){
    for(i=0;i<bars*16;i++){
      s=Math.floor(i*six*sr);
      if(i%4===0){
        L=Math.floor(.3*sr);if(s+L>N)break;
        for(jj=0;jj<L&&s+jj<N;jj++){
          t=jj/sr;
          f=38+90*Math.exp(-t*28);
          env=Math.exp(-t*11);
          out[s+jj]+=Math.sin(2*Math.PI*f*t)*env*.7;
          // Add click transient
          if(jj<50)out[s+jj]+=(Math.random()*2-1)*Math.exp(-jj/10)*.3;
        }
      }
      if(i%8===4){
        L=Math.floor(.12*sr);if(s+L>N)break;
        for(jj=0;jj<L&&s+jj<N;jj++){
          t=jj/sr;
          // Snare: noise + body
          out[s+jj]+=(Math.random()*2-1)*Math.exp(-t*25)*.35;
          out[s+jj]+=Math.sin(2*Math.PI*190*t)*Math.exp(-t*30)*.2;
        }
      }
      if(i%2===0){
        L=Math.floor(.02*sr);if(s+L>N)break;
        for(jj=0;jj<L&&s+jj<N;jj++){
          t=jj/sr;
          // Hi-hat: filtered noise
          out[s+jj]+=(Math.random()*2-1)*Math.exp(-t*200)*.12;
        }
      }
    }
  }else if(type==="chord"){
    var progs=[[0,3,4,0],[0,5,3,4],[5,3,4,0]];
    var prog=progs[Math.floor(Math.random()*progs.length)];
    for(var bar=0;bar<bars;bar++){
      var cr=sc[prog[bar%4]%sc.length];
      var notes=[cr,cr+3,cr+7];
      s=Math.floor(bar*beat*4*sr);L=Math.floor(beat*4*.9*sr);
      if(s+L>N)break;
      for(var n=0;n<notes.length;n++){
        f=m2f(root+notes[n]);
        for(jj=0;jj<L&&s+jj<N;jj++){
          t=jj/sr;
          env=adsr(t,.05,.1,.6,.2,L/sr);
          var phase=2*Math.PI*f*t;
          osc=richWave(phase,.3);
          // Stereo spread per note
          var pan=(n/notes.length-.5)*.4;
          out[s+jj]+=osc*env*(1-Math.abs(pan))*.15;
        }
      }
    }
  }else{
    // FX/other: sweep
    for(i=0;i<N;i++){
      t=i/sr;
      var p=i/N;
      f=100+p*p*5000;
      env=p*(1-p)*4; // Fade in and out
      out[i]=Math.sin(2*Math.PI*f*t)*env*.25+(Math.random()*2-1)*p*.08;
    }
  }
  
  // Professional mastering chain
  var pk=0;for(i=0;i<N;i++)pk=Math.max(pk,Math.abs(out[i]));
  if(pk>0){
    // Soft clip instead of hard normalize
    var target=.85;
    for(i=0;i<N;i++){
      out[i]=Math.tanh(out[i]/pk*2)*target;
    }
  }
  // Fade in/out
  var fd=Math.floor(sr*.01);
  for(i=0;i<fd&&i<N;i++){out[i]*=i/fd;out[N-1-i]*=i/fd}
  
  var buf=AC.createBuffer(1,N,sr);
  buf.getChannelData(0).set(out);
  return buf;
}


function genLoopV2(type,key,scale,bars,bpm){
  if(!AC&&!initAudio())return null;
  return genLoop(type,key,scale,bars,bpm);
}

// === PLAYBACK ===
function playSlice(bi,si,vel){
  if(!AC&&!initAudio())return;
  if(!AC)return;
  var bank=S.banks[bi];
  if(!bank||!bank.buf||!bank.slices||!bank.slices[si])return;
  var sl=bank.slices[si];
  var src=AC.createBufferSource(),gn=AC.createGain(),now=AC.currentTime;
  src.buffer=bank.buf;
  src.playbackRate.value=bank.speed*Math.pow(2,bank.pitch/12);
  gn.gain.setValueAtTime(0,now);
  gn.gain.linearRampToValueAtTime(vel||1,now+Math.max(.003,bank.atk/1000));
  var durSec=Math.max(.01,sl.d/bank.speed);
  gn.gain.setValueAtTime(vel||1,now+Math.max(.01,durSec-Math.max(.005,bank.rel/1000)));
  gn.gain.linearRampToValueAtTime(0,now+durSec);
  src.connect(gn);gn.connect(nHP);
  if(S.fx.delay)gn.connect(nDel);
  if(S.fx.reverb)gn.connect(nVerb);
  src.start(now,bank.rev?(bank.buf.length-sl.e)/bank.buf.sampleRate:sl.s/bank.buf.sampleRate,durSec);
  src.stop(now+durSec+.05);
  src.onended=function(){try{gn.disconnect()}catch(e){}};
  srcs.push(src);
  if(srcs.length>64){try{srcs.shift().stop()}catch(e){}}
  var pad=document.querySelector('.pad[data-i="'+si+'"]');
  if(pad){pad.classList.add("hit");setTimeout(function(){pad.classList.remove("hit")},150)}
}

var seqStep=0,seqNext=0,schedTimer=null;
function schedLoop(){
  if(!S.playing||!AC)return;
  var bank=S.banks[S.bank];
  if(bank&&bank.slices&&bank.slices.length){
    var si=seqStep%bank.slices.length;
    var sDur=(60/S.bpm)/4;
    var sw=(seqStep%2===1)?S.swing/100*sDur*.5:0;
    var ms=(seqNext-AC.currentTime+sw)*1000;
    (function(s){setTimeout(function(){if(S.playing)playSlice(S.bank,s)},Math.max(0,ms))})(si);
    seqNext+=sDur;
    seqStep=(seqStep+1)%16;
  }
  schedTimer=setTimeout(schedLoop,25);
}

function play(){
  if(!AC&&!initAudio())return;
  if(!AC)return;
  if(AC.state==="suspended")AC.resume();
  if(S.playing)return;
  S.playing=true;
  seqStep=0;seqNext=AC.currentTime+0.05;
  schedLoop();
  var pb=$("playBtn");if(pb){pb.textContent="\u23F8";pb.classList.add("active")}
  log("Playing","ok");
}

function stop(){
  S.playing=false;
  if(schedTimer)clearTimeout(schedTimer);
  srcs.forEach(function(s){try{s.stop()}catch(e){}});
  srcs=[];
  var pb=$("playBtn");if(pb){pb.textContent="\u25B6";pb.classList.remove("active")}
}

function playAll(){
  if(!AC&&!initAudio())return;
  var bank=S.banks[S.bank];
  if(!bank||!bank.slices||!bank.slices.length)return;
  var iv=(60/S.bpm)/bank.slices.length;
  bank.slices.forEach(function(_,i){setTimeout(function(){playSlice(S.bank,i)},i*iv*1000)});
}

function renderBanks(){

    el.appendChild(d);
  });
}

function renderPads(){
  var el=$("padsEl");if(!el)return;el.innerHTML="";
  var bank=S.banks[S.bank];
  var numSlices=(bank&&bank.slices)?bank.slices.length:0;
  for(var i=0;i<16;i++){
    var d=document.createElement("div");
    var has=i<numSlices;
    d.className="pad"+(has?"":" off");
    d.dataset.i=i;
    d.textContent=String(i+1).padStart(2,'0');
    if(has){(function(idx){d.onclick=function(){playSlice(S.bank,idx)}})(i)}
    el.appendChild(d);
  }
}

function renderWave(){
  var cv=$("waveCv");if(!cv)return;
  var wrap=cv.parentElement;
  cv.width=wrap.clientWidth||600;cv.height=wrap.clientHeight||110;
  var ctx=cv.getContext("2d");
  ctx.fillStyle="#0a0a0f";ctx.fillRect(0,0,cv.width,cv.height);
  var bank=S.banks[S.bank];
  if(!bank||!bank.buf){
    ctx.fillStyle="#484858";ctx.font="10px monospace";ctx.textAlign="center";
    ctx.fillText("NO AUDIO - GENERATE OR LOAD",cv.width/2,cv.height/2);
    return;
  }
  var d=bank.buf.getChannelData(0);
  var step=Math.ceil(d.length/cv.width);
  ctx.strokeStyle="#00e676";ctx.lineWidth=1.5;ctx.globalAlpha=0.9;
  ctx.beginPath();
  for(var i=0;i<cv.width;i++){
    var mn=1,mx=-1;
    for(var j=0;j<step&&i*step+j<d.length;j++){
      var v=d[i*step+j];if(v<mn)mn=v;if(v>mx)mx=v;
    }
    ctx.moveTo(i,(1-mx)*cv.height/2);
    ctx.lineTo(i,(1-mn)*cv.height/2);
  }
  ctx.stroke();ctx.globalAlpha=1;
  var mk=$("marksEl");
  if(mk){
    mk.innerHTML="";
    if(bank.slices&&bank.slices.length){
      var tl=bank.buf.length;
      bank.slices.forEach(function(s){
        var m=document.createElement("div");
        m.style.cssText="position:absolute;top:0;bottom:0;width:1px;background:#00e676;opacity:0.3;left:"+(s.s/tl*100)+"%";
        mk.appendChild(m);
      });
    }
  }
}

function renderFX(){
  var el=$("fxEl");if(!el)return;
  var fxs=[
    {id:"filter",name:"Filter",on:S.fx.filter,slider:"filterF",min:100,max:15000,val:S.fxP.filterF},
    {id:"delay",name:"Delay",on:S.fx.delay,slider:"delayM",min:0,max:100,val:S.fxP.delayM*100},
    {id:"reverb",name:"Reverb",on:S.fx.reverb,slider:"revM",min:0,max:100,val:S.fxP.revM*100},
    {id:"dist",name:"Drive",on:S.fx.dist,slider:"distD",min:0,max:100,val:S.fxP.distD*100}
  ];
  el.innerHTML="";
  fxs.forEach(function(fx){
    var card=document.createElement("div");
    card.className="fx-card";
    var tog=document.createElement("div");
    tog.className="fx-toggle"+(fx.on?" on":"");
    tog.onclick=function(){S.fx[fx.id]=!S.fx[fx.id];this.classList.toggle("on");applyFX()};
    var nm=document.createElement("div");
    nm.className="fx-name";nm.textContent=fx.name;
    var sl=document.createElement("input");
    sl.type="range";sl.min=fx.min;sl.max=fx.max;sl.value=fx.val;
    sl.oninput=function(){
      if(fx.id==="filter")S.fxP.filterF=parseInt(this.value);
      if(fx.id==="delay")S.fxP.delayM=parseInt(this.value)/100;
      if(fx.id==="reverb")S.fxP.revM=parseInt(this.value)/100;
      if(fx.id==="dist")S.fxP.distD=parseInt(this.value)/100;
      applyFX();
    };
    card.appendChild(tog);card.appendChild(nm);card.appendChild(sl);
    el.appendChild(card);
  });
}

function renderLib(){
  var el=$("libEl");if(!el)return;el.innerHTML="";
  if(typeof LIB==="undefined")return;
  LIB.forEach(function(item,idx){
    var d=document.createElement("div");
    d.className="lib-item";
    d.innerHTML='<span class="name">'+item.n+'</span><span class="tag">'+item.t+'</span>';
    d.onclick=function(){loadLib(idx)};
    el.appendChild(d);
  });
}

function renderAll(){
  renderBanks();renderPads();renderWave();renderFX();renderLib();
  var info=$("infoEl");
  if(info){
    var bank=S.banks[S.bank];
if(bank&&bank.info){
      info.textContent=bank.info.dur.toFixed(2)+"s | "+bank.info.tempo+"bpm | "+bank.slices.length+" slices";
    }else{
      info.textContent="No audio loaded";
    }
  }
}

// === LOAD ===
function loadLib(idx){
  if(typeof LIB==="undefined")return;
  var item=LIB[idx];
  if(!item)return;
  if(!AC&&!initAudio())return;
  log("Loading "+item.n+"...");
  fetch(item.f).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.arrayBuffer();
  }).then(function(ab){
    if(!AC)return null;
    if(!ab||ab.byteLength===0)throw new Error("Empty");
    return AC.decodeAudioData(ab);
  }).then(function(buf){
    if(!buf)return;
    var bank=S.banks[S.bank];
    bank.buf=buf;bank.info=analyze(buf);bank.slices=sliceBuf(buf,S.sens);
    log("Loaded "+item.n+" ("+bank.slices.length+" slices)","ok");
    renderAll();
  }).catch(function(e){log("Load error: "+e.message,"er")});
}

function loadFile(file){
  if(!AC&&!initAudio())return;
  var reader=new FileReader();
  reader.onload=function(e){
    AC.decodeAudioData(e.target.result).then(function(buf){
      var bank=S.banks[S.bank];
      bank.buf=buf;bank.info=analyze(buf);bank.slices=sliceBuf(buf,S.sens);
      log("Loaded ("+bank.slices.length+" slices)","ok");
      renderAll();
    }).catch(function(e){log("Load error: "+e.message,"er")});
  };
  reader.readAsArrayBuffer(file);
}

// === EXPORT ===
function exportWAV(){
  var bank=S.banks[S.bank];
  if(!bank||!bank.buf){log("Nothing to export","er");return}
  var d=bank.buf.getChannelData(0),sr=bank.buf.sampleRate;
  var ab=new ArrayBuffer(44+d.length*2),v=new DataView(ab);
  function ws(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}
  ws(0,"RIFF");v.setUint32(4,36+d.length*2,true);ws(8,"WAVE");ws(12,"fmt ");
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  ws(36,"data");v.setUint32(40,d.length*2,true);
  for(var i=0;i<d.length;i++){
    var s=Math.max(-1,Math.min(1,d[i]));
    v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);
  }
  var blob=new Blob([ab],{type:"audio/wav"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download="psy-looper.wav";a.click();
  URL.revokeObjectURL(url);
  log("Exported WAV","ok");
}

// === BIND EVENTS ===
function bindEvents(){
  var pb=$("playBtn");if(pb)pb.onclick=function(){S.playing?stop():play()};
  var sb=$("stopBtn");if(sb)sb.onclick=stop;
  var br=$("bpmRange");if(br)br.oninput=function(){S.bpm=parseInt(this.value);var bv=$("bpmVal");if(bv)bv.textContent=S.bpm;if(nDel&&AC)nDel.delayTime.setTargetAtTime((60/S.bpm)*0.75,AC.currentTime,.05)};
  var gb=$("genBtn");if(gb)gb.onclick=function(){
    if(!AC&&!initAudio())return;
    var key=($("genKey")||{value:"A"}).value;
    var scale=($("genScale")||{value:"minor"}).value;
    var bars=parseInt(($("genBars")||{value:"4"}).value)||4;
    log("Generating "+S.genType+"...");
    setTimeout(function(){
      if(!AC)return;
      var buf=genLoop(S.genType,key,scale,bars,S.bpm);
      if(!buf)return;
      var bank=S.banks[S.bank];
      bank.buf=buf;bank.info=analyze(buf);bank.slices=sliceBuf(buf,S.sens);
      log("Generated ("+bank.slices.length+" slices)","ok");
      renderAll();
    },30);
  };
  var lb=$("loadBtn");if(lb)lb.onclick=function(){var fi=$("fileIn");if(fi)fi.click()};
  var fi=$("fileIn");if(fi)fi.onchange=function(){if(this.files[0])loadFile(this.files[0])};
  var eb=$("expBtn");if(eb)eb.onclick=exportWAV;
  var ab=$("allBtn");if(ab)ab.onclick=playAll;
  var rb=$("revBtn");if(rb)rb.onclick=function(){var b=S.banks[S.bank];b.rev=!b.rev;log("Reverse: "+(b.rev?"ON":"OFF"))};
  var rsb=$("resliceBtn");if(rsb)rsb.onclick=function(){var b=S.banks[S.bank];if(b.buf){b.slices=sliceBuf(b.buf,S.sens);renderAll();log("Re-sliced: "+b.slices.length,"ok")}};
  var cb=$("clearBtn");if(cb)cb.onclick=function(){S.banks[S.bank]={buf:null,slices:[],info:null,pitch:0,speed:1,atk:3,rel:60,rev:false};renderAll();log("Cleared")};
  // Gen type buttons
  var gts=document.querySelectorAll('.gen-btn');
  gts.forEach(function(btn){
    btn.onclick=function(){
      gts.forEach(function(b){b.classList.remove("on")});
      this.classList.add("on");
      S.genType=this.dataset.t||this.textContent.trim().toLowerCase();
    };
  });
  // Sliders
  var pr=$("piR");if(pr)pr.oninput=function(){S.banks[S.bank].pitch=parseInt(this.value);var pv=$("piV");if(pv)pv.textContent=this.value};
  var sr=$("spR");if(sr)sr.oninput=function(){S.banks[S.bank].speed=parseInt(this.value)/100;var sv=$("spV");if(sv)sv.textContent=(parseInt(this.value)/100).toFixed(1)};
  var ar=$("atR");if(ar)ar.oninput=function(){S.banks[S.bank].atk=parseInt(this.value);var av=$("atV");if(av)av.textContent=this.value};
  var rl=$("rlR");if(rl)rl.oninput=function(){S.banks[S.bank].rel=parseInt(this.value);var rv=$("rlV");if(rv)rv.textContent=this.value};
  var vr=$("volR");if(vr)vr.oninput=function(){S.vol=parseInt(this.value)/100;if(master)master.gain.value=S.vol;var vv=$("volV");if(vv)vv.textContent=this.value};
  var swr=$("swR");if(swr)swr.oninput=function(){S.swing=parseInt(this.value);var swv=$("swV");if(swv)swv.textContent=this.value};
  var senr=$("senR");if(senr)senr.oninput=function(){S.sens=parseInt(this.value);var senv=$("senV");if(senv)senv.textContent=this.value};
}

// === INIT ===
function init(){
  try{
    renderAll();
    bindEvents();
    log("PSY LOOPER PRO ready","ok");
    log("Press GENERATE or load a loop","ok");
  }catch(e){
    console.error("INIT ERROR:",e);
    if(document.body){
      document.body.innerHTML='<div style="color:#ff3d5a;padding:20px;font-family:monospace">INIT ERROR: '+e.message+'</div>';
    }
  }
}

// Call init
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",init);
}else{
  init();
}
window.addEventListener("load",function(){try{init()}catch(e){console.error(e)}});

</script>
