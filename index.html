<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PSY LOOPER PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0a0a0f;--panel:#14141a;--panel2:#1c1c24;--panel3:#222230;
--border:#2a2a35;--border2:#3a3a45;
--text:#e0e0e8;--text2:#686878;--text3:#484858;
--accent:#00e676;--accent2:#00e67633;--accent3:#00e67618;
--warn:#ff6b35;--err:#ff3d5a;--info:#4dabf7;
--mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:12px}
button{cursor:pointer;font-family:var(--sans);border:none;outline:none}
select,input{font-family:var(--sans);outline:none}
.app{display:flex;flex-direction:column;height:100vh}

/* HEADER */
.hd{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd-left{display:flex;align-items:center;gap:16px}
.logo{font-size:13px;font-weight:600;letter-spacing:2px;color:var(--text)}
.logo span{color:var(--accent);font-weight:300}
.ver{font-size:9px;color:var(--text3);font-family:var(--mono)}
.transport{display:flex;align-items:center;gap:8px}
.bpm-box{font-family:var(--mono);font-size:14px;color:var(--accent);background:var(--bg);border:1px solid var(--border);padding:4px 10px;min-width:60px;text-align:center}
.btn{padding:5px 12px;border-radius:3px;background:var(--panel2);color:var(--text);font-size:10px;letter-spacing:0.5px;transition:all 80ms ease;border:1px solid var(--border)}
.btn:hover{border-color:var(--border2);background:var(--panel3)}
.btn:active{transform:scale(0.96)}
.btn-play{min-width:70px;font-family:var(--mono);font-size:11px}
.btn-play.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn-rec{min-width:60px;font-family:var(--mono);font-size:11px}
.btn-rec.active{background:var(--err);color:#fff;border-color:var(--err)}
.btn-sm{padding:4px 8px;font-size:9px}
.btn-accent{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}
.btn-accent:hover{background:#00c866}

/* MAIN LAYOUT */
.main{flex:1;display:grid;grid-template-columns:220px 1fr 240px;gap:1px;background:var(--border);overflow:hidden}
.col{background:var(--panel);overflow-y:auto;padding:12px}
.col::-webkit-scrollbar{width:4px}
.col::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.col-center{background:var(--bg);padding:12px;overflow-y:auto}
.col-right{border-left:1px solid var(--border)}
.col-left{border-right:1px solid var(--border)}

/* SECTION HEADERS */
.sec{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sec:first-child{margin-top:0}

/* BANKS */
.banks-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.bank{padding:10px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:3px;text-align:center;cursor:pointer;transition:all 120ms ease;position:relative}
.bank:hover{border-color:var(--border2)}
.bank.active{border-color:var(--accent);box-shadow:0 0 8px var(--accent3)}
.bank .num{font-family:var(--mono);font-size:13px;color:var(--text2)}
.bank.active .num{color:var(--accent)}
.bank.loaded::after{content:'';position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

/* WAVEFORM */
.wave-wrap{background:var(--bg);border:1px solid var(--border);border-radius:4px;height:110px;position:relative;overflow:hidden;margin-bottom:12px}
.wave-wrap canvas{width:100%;height:100%;display:block}

/* PADS */
.pads-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:12px}
.pad{aspect-ratio:1;background:var(--panel2);border:1px solid var(--border);border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 60ms ease-out;font-family:var(--mono);font-size:10px;color:var(--text2)}
.pad:hover{border-color:var(--border2)}
.pad.hit{background:var(--accent);color:var(--bg);box-shadow:0 0 16px var(--accent2);transform:scale(0.93)}
.pad.off{opacity:0.2;pointer-events:none}

/* SEQUENCER */
.seq-grid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-bottom:12px}
.sq{aspect-ratio:1;background:var(--panel2);border:1px solid var(--border);border-radius:2px;cursor:pointer;transition:all 80ms linear}
.sq.on{background:var(--accent);border-color:var(--accent)}
.sq.play{border-color:var(--accent);box-shadow:0 0 8px var(--accent3)}

/* TOOLS */
.tools-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}

/* FX RACK */
.fx-card{background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:8px 10px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.fx-toggle{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;flex-shrink:0;transition:all 100ms}
.fx-toggle.on{background:var(--accent);box-shadow:0 0 6px var(--accent2)}
.fx-name{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text2);width:50px;flex-shrink:0}
.fx-card input[type=range]{flex:1;height:3px}

/* MACROS */
.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:12px}
.macro{padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:3px;text-align:center;cursor:pointer;transition:all 100ms;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.macro:hover{border-color:var(--border2);color:var(--text)}
.macro:active{transform:scale(0.96);border-color:var(--accent);color:var(--accent)}

/* SLIDERS */
.ctrl{margin-bottom:8px}
.ctrl label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:0.5px;color:var(--text2);margin-bottom:4px}
.ctrl label span{font-family:var(--mono);color:var(--accent);font-size:10px}
input[type=range]{width:100%;height:3px;-webkit-appearance:none;background:var(--border);border-radius:2px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--accent);border-radius:50%;cursor:pointer}
select{width:100%;padding:5px 8px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:3px;font-size:10px;cursor:pointer}

/* LIBRARY */
.lib-item{background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:6px 10px;margin-bottom:3px;cursor:pointer;transition:all 100ms;display:flex;justify-content:space-between;align-items:center}
.lib-item:hover{border-color:var(--accent)}
.lib-item .name{font-size:10px;color:var(--text)}
.lib-item .tag{font-size:8px;font-family:var(--mono);color:var(--text3);background:var(--bg);padding:2px 5px;border-radius:2px}

/* GEN */
.gen-row{display:flex;gap:4px;margin-bottom:4px}
.gen-row select{flex:1}

/* XY PAD */
.xy-pad{width:100%;aspect-ratio:1;background:var(--panel2);border:1px solid var(--border);border-radius:4px;position:relative;cursor:crosshair;margin-bottom:12px}
.xy-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent2);transform:translate(-50%,-50%);pointer-events:none}

/* LFO */
.lfo-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.lfo-row select{width:60px}
.lfo-row input[type=range]{flex:1}
.lfo-row span{font-family:var(--mono);font-size:9px;color:var(--accent);min-width:35px}
.lfo-viz{height:20px;background:var(--panel2);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:12px}
.lfo-viz canvas{width:100%;height:100%;display:block}

/* LOG */
.log-bar{background:var(--panel);border-top:1px solid var(--border);padding:6px 16px;font-family:var(--mono);font-size:9px;color:var(--text3);display:flex;justify-content:space-between}
.log-bar .log-msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
.log-bar .log-msg.ok{color:var(--accent)}
.log-bar .log-msg.er{color:var(--err)}
.log-bar .log-msg.info{color:var(--info)}

/* METER */
.meter{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--warn),var(--err));width:0%;transition:width 40ms}

/* RESPONSIVE */
@media(max-width:1100px){.main{grid-template-columns:180px 1fr 200px}}
@media(max-width:800px){.main{grid-template-columns:1fr;grid-template-rows:auto auto auto}}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<div class="hd">
<div class="hd-left">
<div class="logo">PSY LOOPER <span>PRO</span></div>
<div class="ver">v5.0</div>
</div>
<div class="transport">
<div class="bpm-box" id="bpmVal">145</div>
<input type="range" id="bpmRange" min="60" max="200" value="145" style="width:80px">
<button class="btn btn-sm" id="tapBtn">TAP</button>

<div class="transport">
<button class="btn btn-sm" id="loadBtn">LOAD</button>
<button class="btn btn-sm" id="expBtn">EXPORT</button>
<button class="btn btn-sm" id="exportBtn">WAV</button>
<button class="btn btn-sm" id="midiBtn">MIDI</button>

<select id="genScale"><option value="minor" selected>Minor</option><option value="major">Major</option><option value="phrygian">Phrygian</option><option value="dorian">Dorian</option><option value="mixolydian">Mixolydian</option></select>

<select id="genType">
<option value="melodic">Melodic</option><option value="rhythmic">Rhythmic</option>
<option value="bass">Bass</option><option value="lead">Lead</option>
<option value="fx">FX</option><option value="percussion">Percussion</option>
<option value="chord">Chord</option><option value="atmospheric">Atmospheric</option>
<option value="arp-up">Arp Up</option><option value="arp-down">Arp Down</option>
<option value="arp-rand">Arp Random</option><option value="chord-stab">Chord Stab</option>

</div>

<!-- CENTER COLUMN -->
<div class="col col-center">
<div class="sec">Waveform <span id="bankLabel" style="color:var(--accent)">01</span></div>
<div class="wave-wrap">
<canvas id="waveCv"></canvas>
<div id="marksEl" style="position:absolute;inset:0;pointer-events:none"></div>
</div>

<div class="sec">Slice Pads</div>
<div class="pads-grid" id="padsEl"></div>

<div class="sec">Tools</div>
<div class="tools-row">
<button class="btn btn-sm" id="allBtn">PLAY ALL</button>
<button class="btn btn-sm" id="revBtn">REVERSE</button>
<button class="btn btn-sm" id="resliceBtn">RESLICE</button>
<button class="btn btn-sm" id="clearBtn">CLEAR</button>
<button class="btn btn-sm" id="randBtn">RANDOM</button>
<button class="btn btn-sm" id="probBtn">PROB</button>
</div>
<div class="tools-row">
<button class="btn btn-sm" id="glitchBtn">GLITCH</button>
<button class="btn btn-sm" id="freezeBtn">FREEZE</button>
<button class="btn btn-sm" id="stutterBtn">STUTTER</button>

</div>

<div class="sec">Sequencer</div>

<div class="tools-row">
<button class="btn btn-sm" id="seqPlayBtn">SEQ PLAY</button>

</div>

<div class="sec">Spectrum</div>
<div class="wave-wrap" style="height:60px">
<canvas id="specCv"></canvas>
</div>
<div class="meter"><i id="meterEl"></i></div>
</div>

<!-- RIGHT COLUMN -->
<div class="col col-right">

<div id="fxEl"></div>

<div class="sec">Macros</div>
<div class="macro-grid">
<div class="macro" id="macroSpace">SPACE</div>

</div>

<div class="sec">XY Control</div>
<div class="xy-pad" id="xyE">
<div class="xy-dot" id="xyDot" style="left:50%;top:50%"></div>
</div>

<div class="sec">LFO</div>
<div class="lfo-row">
<select id="lfoWave"><option value="sine">Sine</option><option value="tri">Tri</option><option value="saw">Saw</option><option value="sq">Square</option><option value="rnd">Random</option></select>
<input type="range" id="lfoRate" min="1" max="200" value="30">
<span id="lfoHz">1.5Hz</span>

</div>

<div class="sec">Master</div>
<div class="ctrl"><label>VOLUME <span id="volV">80</span></label><input type="range" id="volR" min="0" max="100" value="80"></div>
<div class="ctrl"><label>SWING <span id="swV">0</span></label><input type="range" id="swR" min="0" max="70" value="0"></div>

<div class="sec">Slice Params</div>
<div class="ctrl"><label>PITCH <span id="piV">0</span></label><input type="range" id="piR" min="-24" max="24" value="0"></div>

<div class="ctrl"><label>ATTACK <span id="atV">3</span></label><input type="range" id="atR" min="0" max="100" value="3"></div>
<div class="ctrl"><label>RELEASE <span id="rlV">60</span></label><input type="range" id="rlR" min="5" max="500" value="60"></div>
</div>

</div>

<!-- LOG BAR -->
<div class="log-bar">
<div class="log-msg" id="logEl">Ready</div>
<div>PSY LOOPER PRO v5.0 | 120 loops | 13 gen types | 15 FX</div>
</div>

</div>

<script>

// === AUDIO ENGINE (CLEAN CHAIN) ===
var AC=null,master=null,analyser=null;
var nFil=null,nHP=null,nDist=null,nComp=null,nSoft=null;
var nDel=null,nDelFb=null,nDelMix=null;
var nVerb=null,nVerbMix=null;
var srcs=[];
var S_fx={filter:true,delay:false,reverb:false,dist:false};
var S_fxP={filterF:12000,delayM:.3,reverbM:.25,distD:.3};

function mkDistCurve(k){
var n=4096,c=new Float32Array(n),i,x;
for(i=0;i<n;i++){x=i*2/n-1;c[i]=k===0?x:Math.tanh(x*k/10)*.9;}
return c;
}

function mkIR(sec,sr){
var len=Math.floor(sec*sr),buf=AC.createBuffer(2,len,sr);
for(var ch=0;ch<2;ch++){
var d=buf.getChannelData(ch);
var seed=12345+ch;
for(var i=0;i<len;i++){
seed=(seed*1664525+1013904223)&0xFFFFFFFF;
var r=((seed>>>0)/4294967296)*2-1;
d[i]=r*Math.pow(1-i/len,2.5);
}}
return buf;
}

function log(msg,type){
var el=$("logEl");if(!el)return;
el.textContent="> "+msg;
el.className="log-msg"+(type?" "+type:"");
}
function initAudio(){
if(AC)return true;
try{
AC=new(window.AudioContext||window.webkitAudioContext)();
var sr=AC.sampleRate;

master=AC.createGain();
master.gain.value=S.vol||0.8;

analyser=AC.createAnalyser();
analyser.fftSize=2048;

nSoft=AC.createWaveShaper();
var nn=4096,cc=new Float32Array(nn);
for(var i=0;i<nn;i++){var x=i*2/nn-1;cc[i]=Math.tanh(x*1.2)*.92;}
nSoft.curve=cc;

nComp=AC.createDynamicsCompressor();
nComp.threshold.value=-12;
nComp.knee.value=10;
nComp.ratio.value=4;
nComp.attack.value=0.003;
nComp.release.value=0.15;

nFil=AC.createBiquadFilter();
nFil.type="lowpass";
nFil.frequency.value=12000;
nFil.Q.value=0.7;

nHP=AC.createBiquadFilter();
nHP.type="highpass";
nHP.frequency.value=25;
nHP.Q.value=0.5;

nDist=AC.createWaveShaper();
nDist.curve=mkDistCurve(0);
nDist.oversample="4x";

nDel=AC.createDelay(2.0);
nDel.delayTime.value=(60/(S.bpm||145))*0.75;
nDelFb=AC.createGain();
nDelFb.gain.value=0.4;
nDelMix=AC.createGain();
nDelMix.gain.value=0;
nDel.connect(nDelFb);
nDelFb.connect(nDel);
nDel.connect(nDelMix);

nVerb=AC.createConvolver();
nVerb.buffer=mkIR(2.5,sr);
nVerbMix=AC.createGain();
nVerbMix.gain.value=0;
nVerb.connect(nVerbMix);

// CHAIN: nHP -> nFil -> nDist -> nComp -> nSoft -> master -> analyser -> out
nHP.connect(nFil);
nFil.connect(nDist);
nDist.connect(nComp);
nComp.connect(nSoft);
nSoft.connect(master);
master.connect(analyser);
analyser.connect(AC.destination);

// Parallel sends
nDelMix.connect(nHP);
nVerbMix.connect(nHP);

log("Audio engine ready @ "+sr+"Hz","ok");
return true;
}catch(e){
log("Audio init error: "+e.message,"er");
return false;
}
}

function distCurve(k){return mkDistCurve(k);}

function applyFX(){
if(!AC)return;
if(nFil)nFil.frequency.setTargetAtTime(S.fx.filter?S.fxP.filterF:20000,AC.currentTime,.02);
if(nDelMix)nDelMix.gain.setTargetAtTime(S.fx.delay?S.fxP.delayM:0,AC.currentTime,.02);
if(nVerbMix)nVerbMix.gain.setTargetAtTime(S.fx.reverb?S.fxP.revM:0,AC.currentTime,.02);
if(nDist)nDist.curve=mkDistCurve(S.fx.dist?S.fxP.distD*50:0);
if(nDel)nDel.delayTime.setTargetAtTime((60/S.bpm)*0.75,AC.currentTime,.05);
}




// ============================================================
// PSY LOOPER v2.0 - Professional Audio Engine
// Defensive coding - all access guarded
// ============================================================
(function(){

// === MUSIC THEORY (must be before genLoopV2) ===
var KEYS={C:60,"C#":61,D:62,"D#":63,E:64,F:65,"F#":66,G:67,"G#":68,A:69,"A#":70,B:71};
var SCALES={minor:[0,2,3,5,7,8,10],major:[0,2,4,5,7,9,11],phrygian:[0,1,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],mixolydian:[0,2,4,5,7,9,10]};
function m2f(m){return 440*Math.pow(2,(m-69)/12)}

// === ANALYZE: Audio analysis ===
function analyze(buf){
if(!buf)return null;
var d=buf.getChannelData(0),sr=buf.sampleRate;
var sum=0,pk=0,i;
for(i=0;i<d.length;i++){sum+=d[i]*d[i];pk=Math.max(pk,Math.abs(d[i]));}
var rms=Math.sqrt(sum/d.length);
// Tempo detection via onset autocorrelation
var hop=512,ens=[],e,j;
for(i=0;i+hop<d.length;i+=hop){e=0;for(j=0;j<hop;j++)e+=d[i+j]*d[i+j];ens.push(e/hop);}
var fps=sr/hop,best=145,bc=-1,bpm,lag,c;
for(bpm=60;bpm<=200;bpm++){
lag=Math.round(60/bpm*fps);
if(lag>=ens.length/2)continue;
c=0;for(i=0;i<ens.length-lag;i++)c+=ens[i]*ens[i+lag];
if(c>bc){bc=c;best=bpm;}
}
return{dur:buf.duration,rms:rms,peak:pk,tempo:best};
}

// === SLICEBUF: Transient-based slice detection ===
function sliceBuf(buf,sens){
if(!buf)return[];
var d=buf.getChannelData(0),sr=buf.sampleRate;
var thr=1-(sens||50)/100;
var hop=512,fr=1024,flux=[],i,j,e;

// === PLAY SLICE (CLEAN) ===
function playSlice(bi,si,vel){
if(!AC&&!initAudio())return;
if(AC.state==="suspended")AC.resume();
var bank=S.banks[bi];
if(!bank||!bank.buf||!bank.slices||!bank.slices[si]){if(!bank||!bank.buf)log("Load or generate a loop first","info");return;}

var sl=bank.slices[si];
var src=AC.createBufferSource();
var gain=AC.createGain();
var now=AC.currentTime;

// Choose buffer (normal or reversed)
if(bank.rev){
src.buffer=getReversedBuffer(bank.buf);
var startSec=(bank.buf.length-sl.e)/bank.buf.sampleRate;
}else{
src.buffer=bank.buf;
var startSec=sl.s/bank.buf.sampleRate;
}

src.playbackRate.value=bank.speed*Math.pow(2,bank.pitch/12);

// Envelope: smooth attack and release
var durSec=Math.max(0.01,sl.d/bank.speed);
var atkSec=Math.max(0.003,bank.atk/1000);
var relSec=Math.max(0.005,bank.rel/1000);

gain.gain.setValueAtTime(0,now);
gain.gain.linearRampToValueAtTime(vel||1,now+atkSec);
if(durSec>atkSec+relSec){
gain.gain.setValueAtTime(vel||1,now+durSec-relSec);
gain.gain.linearRampToValueAtTime(0,now+durSec);
}else{
gain.gain.linearRampToValueAtTime(0,now+durSec);
}

// Connect: source -> gain -> main chain
src.connect(gain);
gain.connect(nHP);

// Parallel sends
if(S.fx.delay||S_fx.delay)gain.connect(nDel);
if(S.fx.reverb||S_fx.reverb)gain.connect(nVerb);

src.start(now,startSec,durSec);
src.stop(now+durSec+0.05);
src.onended=function(){try{gain.disconnect()}catch(e){}};

srcs.push(src);
if(srcs.length>64){var old=srcs.shift();try{old.stop()}catch(e){}}

// Visual feedback
var pad=document.querySelector('.pad[data-i="'+si+'"]');
if(pad){pad.classList.add("hit");setTimeout(function(){pad.classList.remove("hit")},150)}
}

// === REVERSE BUFFER CACHE ===
var revCache=new WeakMap();
function getReversedBuffer(buf){
if(revCache.has(buf))return revCache.get(buf);
var sr=buf.sampleRate;
var ch=buf.numberOfChannels;
var revBuf=AC.createBuffer(ch,buf.length,sr);
for(var c=0;c<ch;c++){
var src=buf.getChannelData(c);
var dst=revBuf.getChannelData(c);
for(var i=0;i<src.length;i++){dst[i]=src[src.length-1-i]}
}
revCache.set(buf,revBuf);
return revBuf;
}

// === TRANSPORT ===
function play(){
  if(!AC&&!initAudio())return;
  if(AC.state==="suspended")AC.resume();
  
  if(S.playing)return;
  S.playing=true;
  // Smooth master ramp to prevent click
  if(master){master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setValueAtTime(0,AC.currentTime);
  master.gain.linearRampToValueAtTime(S.vol,AC.currentTime+0.01);}seqStep=0;seqNext=AC.currentTime+0.05;
  schedLoop();
  $("playBtn").textContent="⏸ Pause";$("playBtn").classList.add("on");
  log("Playing @ "+S.bpm+" BPM","ok");
}
function schedLoop(){
  if(!S.playing)return;
  var bank=S.banks[S.bank],sDur=(60/S.bpm)/4;
  while(seqNext<AC.currentTime+0.1){
    if(bank&&bank.slices&&bank.slices.length>0){
      var si=seqStep%bank.slices.length;
      var sw=(seqStep%2===1)?S.swing/100*sDur*0.5:0;
      var ms=(seqNext-AC.currentTime+sw)*1000;
      (function(s){setTimeout(function(){if(S.playing)playSlice(S.bank,s)},Math.max(0,ms))})(si);
    }
    seqNext+=sDur;seqStep=(seqStep+1)%16;
  }
  seqT=setTimeout(schedLoop,25);
}
function stop(){
  S.playing=false;
  // Smooth master ramp down to prevent click
  if(AC&&master){master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setValueAtTime(master.gain.value,AC.currentTime);
  master.gain.linearRampToValueAtTime(0,AC.currentTime+0.02);
  setTimeout(function(){if(master&&!S.playing)master.gain.value=S.vol},50);}
  if(seqT)clearTimeout(seqT);
  sources.forEach(function(s){try{s.stop()}catch(e){}});
  sources=[];
  $("playBtn").textContent="▶ Play";$("playBtn").classList.remove("on");
}

function initMIDI(){
  if(!navigator.requestMIDIAccess){log("Web MIDI not supported","er");return}
  navigator.requestMIDIAccess().then(function(ma){
    ma.inputs.forEach(function(inp){
      inp.onmidimessage=function(e){
        var st=e.data[0]&0xF0,d1=e.data[1],d2=e.data[2];
        if(st===0x90&&d2>0){var si=(d1-36)%16;if(si>=0)playSlice(S.bank,si,d2/127)}
        else if(st===0xB0){
          if(d1===1){S.fxP.filterF=200+(d2/127)*14800;if(nFilter)nFilter.frequency.value=S.fxP.filterF}
          if(d1===7){S.vol=d2/127;if(master)master.gain.value=S.vol}
        }
      };
    });
    $("midiDot").classList.add("on");
    log("MIDI connected","ok");
  }).catch(function(){log("MIDI failed","er")});
}

function loadLib(idx){
  if(!AC&&!initAudio())return;
  if(AC.state==="suspended")AC.resume();
  var item=LIB[idx];
  if(!item)return;
  log("Loading: "+item.n+"...");
  fetch(item.f).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.arrayBuffer();
  }).then(function(ab){
    return AC.decodeAudioData(ab);
  }).then(function(buf){
    var bank=S.banks[S.bank];
    bank.buf=buf;
    bank.info=analyze(buf);

function renderWave(){
var cv=$("waveCv");if(!cv)return;
var wrap=cv.parentElement;
cv.width=wrap.clientWidth||600;cv.height=wrap.clientHeight||110;
var ctx=cv.getContext("2d");
ctx.fillStyle="#0a0a0f";ctx.fillRect(0,0,cv.width,cv.height);
var bank=S.banks[S.bank];
if(!bank||!bank.buf){
ctx.fillStyle="#484858";ctx.font="10px 'JetBrains Mono',monospace";ctx.textAlign="center";
ctx.fillText("NO AUDIO LOADED",cv.width/2,cv.height/2);
return;
}
var d=bank.buf.getChannelData(0);
var step=Math.ceil(d.length/cv.width);
ctx.strokeStyle="#00e676";ctx.lineWidth=1.5;ctx.globalAlpha=0.9;
ctx.beginPath();
for(var i=0;i<cv.width;i++){
var mn=1,mx=-1;
for(var j=0;j<step&&i*step+j<d.length;j++){
var v=d[i*step+j];if(v<mn)mn=v;if(v>mx)mx=v;
}
ctx.moveTo(i,(1-mx)*cv.height/2);
ctx.lineTo(i,(1-mn)*cv.height/2);
}
ctx.stroke();ctx.globalAlpha=1;
// Draw slice markers
var mk=$("marksEl");if(mk){
mk.innerHTML="";
if(bank.slices&&bank.slices.length){
var tl=bank.buf.length;
bank.slices.forEach(function(s){
var m=document.createElement("div");
m.style.cssText="position:absolute;top:0;bottom:0;width:1px;background:#00e676;opacity:0.3;left:"+(s.s/tl*100)+"%";
mk.appendChild(m);
});
}
}
}

function renderInfo(){

if(!bank||!bank.info)return;
}

function renderSpectrum(){
if(renderSpectrum._t&&performance.now()-renderSpectrum._t<33){requestAnimationFrame(renderSpectrum);return}
renderSpectrum._t=performance.now();
var cv=$("specCv");if(!cv||!analyser){requestAnimationFrame(renderSpectrum);return}
var wrap=cv.parentElement;
cv.width=wrap.clientWidth||600;cv.height=wrap.clientHeight||60;
var ctx=cv.getContext("2d");
var fd=new Uint8Array(analyser.frequencyBinCount);
analyser.getByteFrequencyData(fd);
ctx.fillStyle="#0a0a0f";ctx.fillRect(0,0,cv.width,cv.height);
var bw=cv.width/64;
for(var i=0;i<64;i++){
var v=fd[i*4]/255;
var hue=140+v*80;
ctx.fillStyle="hsla("+hue+",80%,"+(30+v*40)+"%,0.9)";
ctx.fillRect(i*bw,cv.height-v*cv.height,bw-1,v*cv.height);
}
var sum=0;for(var k=0;k<fd.length;k++)sum+=fd[k];
var avg=sum/fd.length/255;
var m=$("meterEl");if(m)m.style.width=(avg*100)+"%";
requestAnimationFrame(renderSpectrum);
}

  $("clearBtn").onclick=function(){S.banks[S.bank]={buf:null,slices:[],info:null,pitch:0,speed:1,atk:5,rel:80,rev:false};renderAll();log("Bank cleared")};
  $("pitchR").oninput=function(){S.banks[S.bank].pitch=parseInt(this.value);$("pitchV").textContent=this.value};
  $("speedR").oninput=function(){S.banks[S.bank].speed=parseInt(this.value)/100;$("speedV").textContent=(parseInt(this.value)/100).toFixed(1)};
  $("atkR").oninput=function(){S.banks[S.bank].atk=parseInt(this.value);$("atkV").textContent=this.value};
  $("relR").oninput=function(){S.banks[S.bank].rel=parseInt(this.value);$("relV").textContent=this.value};
  $("volR").oninput=function(){S.vol=parseInt(this.value)/100;$("volV").textContent=this.value;if(master)master.gain.value=S.vol};
  $("swR").oninput=function(){S.swing=parseInt(this.value);$("swV").textContent=this.value};
  $("senR").oninput=function(){S.sens=parseInt(this.value);$("senV").textContent=this.value};
  
  // Gen type buttons
  document.querySelectorAll(".gen-btn").forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll(".gen-btn").forEach(function(x){x.classList.remove("on")});
      this.classList.add("on");
      S.genType=this.dataset.t;
    };
  });
  
  // Keyboard
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
    var k=e.key;
    if(k===" "){e.preventDefault();S.playing?stop():play()}
    else if(k>="1"&&k<="9"){playSlice(S.bank,parseInt(k)-1)}
    else if(k==="Escape"){stop()}
    else if(k==="g"||k==="G"){// Auto-generate

var key=$("gKey").value,scale=$("gScale").value,bars=parseInt($("gBars").value);

    else if(k==="e"||k==="E"){exportWAV()}
    else if(k>="F1"&&k<="F8"){e.preventDefault();S.bank=parseInt(k.slice(1))-1;$("bankLabel").textContent=S.bank+1;renderAll()}
  });
  
  // Drag & drop
  document.body.addEventListener("dragover",function(e){e.preventDefault()});

// === UNIQUE FX: Glitch, Freeze, Stutter, Tape ===
function glitchFX(){var bk=S.banks[S.bank];if(!bk||!bk.buf)return;log("GLITCH!","ok");
var d=bk.buf.getChannelData(0),sr=bk.buf.sampleRate,r=rng(Date.now());
for(var g=0;g<8;g++){var gs=Math.floor(r()*d.length),gl=Math.floor(sr*(.01+r()*.05));
if(gs+gl>d.length)continue;var chunk=new Float32Array(gl);
for(var i=0;i<gl;i++)chunk[i]=d[gs+i];
for(var rep=1;rep<4&&gs+gl*(rep+1)<d.length;rep++){for(i=0;i<gl;i++)d[gs+gl*rep+i]=chunk[i%gl]*(rep%2===0?1:-1)*.7}}renderWave()}
function freezeFX(){var bk=S.banks[S.bank];if(!bk||!bk.buf)return;log("FREEZE","ok");
var d=bk.buf.getChannelData(0),sr=bk.buf.sampleRate;
var win=Math.floor(sr*.08),start=Math.floor(Math.random()*(d.length-win));
var grain=new Float32Array(win);for(var i=0;i<win;i++)grain[i]=d[start+i];
for(var pos=win;pos+win<d.length;pos+=win){for(i=0;i<win;i++)d[pos+i]=grain[i]*(1-pos/d.length)}renderWave()}
function stutterFX(){var bk=S.banks[S.bank];if(!bk||!bk.buf)return;log("STUTTER","ok");
var d=bk.buf.getChannelData(0),sr=bk.buf.sampleRate,cl=Math.floor(sr*.04);
for(var c=0;c<10;c++){var cs=Math.floor(Math.random()*(d.length-cl*2));
if(Math.random()<.6){for(var i=0;i<cl;i++)d[cs+cl+i]=d[cs+i]}}renderWave()}
function tapeFX(){var bk=S.banks[S.bank];if(!bk||!bk.buf)return;log("TAPE STOP","ok");
var d=bk.buf.getChannelData(0),sr=bk.buf.sampleRate;
var sl=Math.floor(sr*1.2);if(sl>d.length)sl=d.length;var st=d.length-sl;
for(var i=0;i<sl;i++){var t=i/sl,rate=Math.max(.01,1-t);
var si=st+Math.floor(i*rate);if(si<d.length)d[st+i]=d[si]*(1-t)}renderWave()}

var xyOn=false;
function setupXY(){var xy=$("xyE");if(!xy)return;
xy.addEventListener("pointerdown",function(e){xyOn=true;xyMove(e)});
document.addEventListener("pointermove",function(e){if(xyOn)xyMove(e)});
document.addEventListener("pointerup",function(){xyOn=false});
function xyMove(e){var rc=xy.getBoundingClientRect(),x=(e.clientX-rc.left)/rc.width,y=(e.clientY-rc.top)/rc.height;
x=Math.max(0,Math.min(1,x));y=Math.max(0,Math.min(1,y));
var dot=$("xyDot");if(dot){dot.style.left=(x*100)+"%";dot.style.top=(y*100)+"%"}
if(nFil)nFil.frequency.setTargetAtTime(200+x*14800,AC.currentTime,.02);
if(nDist)nDist.curve=distCurve(y*50)}}

var GEN_TYPES=["melodic","rhythmic","bass","lead","fx","percussion","chord","atmospheric","arp-up","arp-down","arp-rand","chord-stab","melody-walk"];
function genLoop(type,key,scale,bars,bpm){
var sr=AC.sampleRate,beat=60/bpm,six=beat/4,N=Math.floor(bars*4*beat*sr);
var out=new Float32Array(N);
var root=(typeof KEYS!=="undefined"&&KEYS[key])?KEYS[key]:69;
var sc=(typeof SCALES!=="undefined"&&SCALES[scale])?SCALES[scale]:[0,2,3,5,7,8,10];
var i,j,s,L,jj,f,env;

if(type==="melodic"||type==="lead"){
var pi=Math.floor(Math.random()*sc.length);
for(i=0;i<bars*16;i++){
if(Math.random()<.65){
pi=Math.max(0,Math.min(sc.length-1,pi+Math.floor(Math.random()*5)-2));
f=440*Math.pow(2,(root+12+sc[pi]-69)/12);
s=Math.floor(i*six*sr);L=Math.floor(six*.9*sr);
if(s+L>N)break;
for(jj=0;jj<L&&s+jj<N;jj++){
var t=jj/sr;
env=Math.min(1,jj/(.005*sr))*Math.exp(-t*4);
out[s+jj]+=(Math.sin(2*Math.PI*f*t)+.3*Math.sin(2*Math.PI*f*2*t))*env*.18;
}}}
}else if(type==="bass"){
var pat=[0,0,12,0,0,0,12,3,0,0,12,0,0,3,12,0];
for(i=0;i<bars*16;i++){
s=Math.floor(i*six*sr);L=Math.floor(six*.8*sr);
if(s+L>N)break;
f=440*Math.pow(2,(root-12+sc[pat[i%16]%sc.length]-69)/12);
for(jj=0;jj<L&&s+jj<N;jj++){
var t2=jj/sr;
env=Math.min(1,jj/(.003*sr))*Math.exp(-t2*6);
out[s+jj]+=(Math.sign(Math.sin(2*Math.PI*f*t2))*.15+Math.sin(2*Math.PI*f*t2)*.4)*env*.5;
}}
}else if(type==="rhythmic"||type==="percussion"){
for(i=0;i<bars*16;i++){
s=Math.floor(i*six*sr);
if(i%4===0){L=Math.floor(.3*sr);if(s+L>N)break;
for(jj=0;jj<L&&s+jj<N;jj++){
var t3=jj/sr;f=38+90*Math.exp(-t3*28);
out[s+jj]+=Math.sin(2*Math.PI*f*t3)*Math.exp(-t3*11)*.7;}}
if(i%8===4){L=Math.floor(.12*sr);if(s+L>N)break;
for(jj=0;jj<L&&s+jj<N;jj++){out[s+jj]+=(Math.random()*2-1)*Math.exp(-jj/sr*25)*.35;}}
if(i%2===0){L=Math.floor(.02*sr);if(s+L>N)break;
for(jj=0;jj<L&&s+jj<N;jj++){out[s+jj]+=(Math.random()*2-1)*Math.exp(-jj/sr*200)*.12;}}
}
}else if(type==="fx"){
for(i=0;i<N;i++){var p=i/N;
f=100+p*p*5000;
out[i]+=Math.sin(2*Math.PI*f*i/sr)*p*.25+(Math.random()*2-1)*p*p*.15;}
}else if(type==="chord"){
var progs=[[0,3,4,0],[0,5,3,4]];
var prog=progs[Math.floor(Math.random()*progs.length)];
for(var bar=0;bar<bars;bar++){
var cr=sc[prog[bar%4]%sc.length];
var notes=[cr,cr+3,cr+7];
s=Math.floor(bar*beat*4*sr);L=Math.floor(beat*4*.9*sr);
if(s+L>N)break;
for(var n=0;n<notes.length;n++){
f=440*Math.pow(2,(root+notes[n]-69)/12);
for(jj=0;jj<L&&s+jj<N;jj++){
var t4=jj/sr;
out[s+jj]+=Math.sin(2*Math.PI*f*t4)*Math.min(1,t4/.01)*Math.exp(-t4*2)*.12;}}}
}else{
for(i=0;i<N;i++){
var t5=i/sr;
out[i]+=Math.sin(2*Math.PI*110*t5)*.05+(Math.random()*2-1)*.01;}
}

var pk=0;for(i=0;i<N;i++)pk=Math.max(pk,Math.abs(out[i]));
if(pk>0){var nm=.82/pk;for(i=0;i<N;i++)out[i]*=nm;}
var fd=Math.floor(sr*.008);
for(i=0;i<fd&&i<N;i++){out[i]*=i/fd;out[N-1-i]*=i/fd;}
var buf=AC.createBuffer(1,N,sr);
buf.getChannelData(0).set(out);
return buf;
}

function genLoopV2(type,key,scale,bars,bpm){
var sr=AC.sampleRate,root=(KEYS[key]||69),sc=SCALES[scale]||SCALES.minor;
if(EXTRA_GEN[type]){
var out=EXTRA_GEN[type](root,sc,bars,bpm,sr);
// Normalize with fades
var pk=0;for(var i=0;i<out.length;i++)pk=Math.max(pk,Math.abs(out[i]));
if(pk>0){var nm=.82/pk;for(i=0;i<out.length;i++)out[i]*=nm}
var fd=Math.floor(sr*.008);
for(i=0;i<fd&&i<out.length;i++){out[i]*=i/fd;out[out.length-1-i]*=i/fd}
fd=Math.floor(sr*.005);
for(i=0;i<fd&&i<out.length;i++){out[i]*=i/fd;out[out.length-1-i]*=i/fd}
var buf=AC.createBuffer(1,out.length,sr);buf.getChannelData(0).set(out);return buf}
return genLoop(type,key,scale,bars,bpm)}

function loadPreset(name){
var p=PRESETS[name];if(!p)return;
S.genType=p.genType;S.bpm=p.bpm;
if(p.fx)S.fx=p.fx;
if(p.fxP)Object.assign(S.fxP,p.fxP);
$("bpmR").value=S.bpm;$("bpmVal").textContent=S.bpm;
$("gKey").value=p.key;$("gScale").value=p.scale;
applyFX();
log("Preset: "+name,"ok");
// Auto-generate
// Auto-generate
if(AC){setTimeout(function(){
var key=$("gKey").value,scale=$("gScale").value,bars=parseInt($("gBars").value);
var buf=genLoopV2(S.genType,key,scale,bars,S.bpm);
var bank=S.banks[S.bank];
bank.buf=buf;bank.info=analyze(buf);bank.slices=sliceBuf(buf,S.sens);
renderAll()},50)}}
// MACRO CONTROLS
function macroSpace(){
// Space macro: reverb + delay + filter
if(!AC)return;
if(nVerbMix)nVerbMix.gain.value=.5;
if(nDelMix)nDelMix.gain.value=.4;
if(nFil)nFil.frequency.value=8000;
log("MACRO: Space","ok")}
function macroEnergy(){
// Energy macro: drive + volume + filter open
if(!AC)return;
if(nDist)nDist.curve=distCurve(30);
if(master)master.gain.value=Math.min(1,S.vol*1.2);
if(nFil)nFil.frequency.value=15000;
log("MACRO: Energy","ok")}
function macroTension(){
// Tension macro: filter close + resonance
if(!AC)return;
if(nFil){nFil.frequency.value=500;nFil.Q.value=8}
log("MACRO: Tension","ok")}
function macroReset(){
// Reset all macros
if(!AC)return;
if(nVerbMix)nVerbMix.gain.setTargetAtTime(S.fx.verb?S.fxP.vm:0,AC.currentTime,.02);
if(nDelMix)nDelMix.gain.value=S.fx.delay?S.fxP.dm:0;
if(nDist)nDist.curve=distCurve(S.fx.drive?S.fxP.dd*50:0);
if(nFil){nFil.frequency.value=S.fxP.ff;nFil.Q.value=.7}
if(master)master.gain.value=S.vol;
log("MACRO: Reset","ok")}
// AUTOMATION: filter sweep over time
var autoFilter=null;
function startFilterSweep(){
if(!AC||!nFil)return;
if(autoFilter){clearInterval(autoFilter);autoFilter=null;log("Auto filter stopped");return}
var startTime=Date.now();
var duration=4000; // 4 seconds
var startFreq=nFil.frequency.value;
var endFreq=200;
autoFilter=setInterval(function(){
var elapsed=Date.now()-startTime;
var progress=Math.min(1,elapsed/duration);
var freq=startFreq+(endFreq-startFreq)*progress;
nFil.frequency.value=freq;
if(progress>=1){clearInterval(autoFilter);autoFilter=null;log("Filter sweep complete","ok")}
},50);
log("Auto filter sweep started","ok")}
// LFO to PITCH
var lfoPitch=null;
function toggleLfoPitch(){
var bk=S.banks[S.bank];if(!bk)return;
if(lfoPitch){clearInterval(lfoPitch);lfoPitch=null;bk.pitch=0;
$("piR").value=0;$("piV").textContent=0;log("LFO pitch off");return}
var phase=0;
lfoPitch=setInterval(function(){
phase+=.1;
bk.pitch=Math.round(Math.sin(phase)*5);
$("piR").value=bk.pitch;$("piV").textContent=bk.pitch},100);
log("LFO pitch on","ok")}
// TAP TEMPO for slices (play slices in rhythm)
function tapSlices(){
var bk=S.banks[S.bank];if(!bk||!bk.slices||!bk.slices.length)return;
var now=Date.now();
if(!S._taps)S._taps=[];
S._taps.push(now);
if(S._taps.length>4)S._taps.shift();
if(S._taps.length>=2){
var intervals=[];
for(var i=1;i<S._taps.length;i++)intervals.push(S._taps[i]-S._taps[i-1]);
var avg=intervals.reduce(function(a,b){return a+b})/intervals.length;
var si=S._taps.length%bk.slices.length;
playSlice(S.bank,si);
log("Tap: "+Math.round(60000/avg)+" BPM","ok")}}


// === LFO IMPLEMENTATION ===
var lfoInterval=null;
function startLFO(){
if(lfoInterval){clearInterval(lfoInterval);lfoInterval=null;
if($("lfoBtn"))$("lfoBtn").classList.remove("on");
log("LFO off");return}
if(!AC||!nFil)return;
var wave="sine";
var w=$("lfoWave");if(w)wave=w.value;
var rate=1.5;
var r=$("lfoRate");if(r)rate=r.value/20;
var hz=$("lfoHz");if(hz)hz.textContent=rate.toFixed(1)+"Hz";
var phase=0;
lfoInterval=setInterval(function(){
phase+=rate*0.05;
var v=0;
var p=phase%1;
if(wave==="sine")v=Math.sin(p*2*Math.PI);
else if(wave==="tri")v=p<.5?p*4-1:3-p*4;
else if(wave==="saw")v=p*2-1;
else if(wave==="sq")v=p<.5?1:-1;
else v=Math.random()*2-1;
var f=500+Math.pow((v+1)/2,2)*10000;
if(nFil)nFil.frequency.setTargetAtTime(f,AC.currentTime,.02);
drawLFO(wave,phase);
},33);
if($("lfoBtn"))$("lfoBtn").classList.add("on");
log("LFO on: "+wave+" @ "+rate.toFixed(1)+"Hz","ok");
}
function drawLFO(wave,phase){
var cv=$("lfoCv");if(!cv)return;
var rc=cv.parentElement.getBoundingClientRect();
cv.width=rc.width||200;cv.height=20;
var ctx=cv.getContext("2d");
ctx.fillStyle="#12121e";ctx.fillRect(0,0,cv.width,cv.height);
ctx.strokeStyle="#00ccff";ctx.lineWidth=1;ctx.beginPath();
for(var i=0;i<cv.width;i++){
var p=(i/cv.width+phase)%1;
var v=0;
if(wave==="sine")v=Math.sin(p*2*Math.PI);
else if(wave==="tri")v=p<.5?p*4-1:3-p*4;
else if(wave==="saw")v=p*2-1;
else if(wave==="sq")v=p<.5?1:-1;
else v=Math.sin(p*20)*.5;
ctx.lineTo(i,10-v*8);
}
ctx.stroke();
}
// Bind LFO button
if($("lfoBtn"))$("lfoBtn").onclick=startLFO;
if($("lfoRate"))$("lfoRate").oninput=function(){
var rate=this.value/20;
if($("lfoHz"))$("lfoHz").textContent=rate.toFixed(1)+"Hz";
};


// === ADVANCED STEP SEQUENCER ===
var seqVel=new Array(16).fill(0.8);
var seqProb=new Array(16).fill(1.0);
var seqRev=new Array(16).fill(false);
var seqPitch=new Array(16).fill(0);
function renderSeqAdvanced(){
var e=$("seqE");if(!e)return;e.innerHTML="";
for(var i=0;i<16;i++){
var d=document.createElement("div");
d.className="sq"+(seqState.steps[i]?" on":"");
(function(x){
d.onclick=function(ev){
if(ev.shiftKey){seqVel[x]=(seqVel[x]+0.25)%1.25;if(seqVel[x]===0)seqVel[x]=0.25;this.style.opacity=0.5+seqVel[x]*0.5}
else if(ev.altKey){seqProb[x]=(seqProb[x]+0.25)%1.25;if(seqProb[x]===0)seqProb[x]=0.25}
else{seqState.steps[x]=!seqState.steps[x];this.classList.toggle("on")}
};
d.ondblclick=function(){seqRev[x]=!seqRev[x];this.style.borderColor=seqRev[x]?"var(--accent)":""}
})(i);
e.appendChild(d);
}
}
// Override seqSched with advanced version
function seqSchedAdvanced(){
if(!seqState.on)return;
var bk=S.banks[S.bank];
if(bk&&bk.slices&&bk.slices.length){
var si=seqState.pos%bk.slices.length;
if(seqState.steps[seqState.pos]&&Math.random()<seqProb[seqState.pos]){
// Apply velocity
var vel=seqVel[seqState.pos];
// Apply reverse if set
var origRev=bk.rev;
if(seqRev[seqState.pos])bk.rev=!bk.rev;
// Apply pitch offset
var origPitch=bk.pitch;
bk.pitch+=seqPitch[seqState.pos];
playSlice(S.bank,si,vel);
bk.rev=origRev;
bk.pitch=origPitch;
}
}
var sqs=document.querySelectorAll(".sq");
sqs.forEach(function(s){s.classList.remove("play")});
if(sqs[seqState.pos])sqs[seqState.pos].classList.add("play");
seqState.pos=(seqState.pos+1)%16;
// Schedule next step (using setTimeout - acceptable for UI sequencer)
  // For sample-accurate timing, use AudioContext.currentTime scheduling
  // Apply swing: delay off-beat steps
  var swingMs=(seqState.pos%2===1)?S.swing/100*((60/S.bpm)/4)*500:0;
  // Apply humanize: random timing variation
  var humMs=S.hum>0?(Math.random()-0.5)*S.hum/100*((60/S.bpm)/4)*300:0;
  setTimeout(seqSchedAdvanced,(60/S.bpm)/4*1000+swingMs+humMs);
}
// Randomize sequencer
function seqRandomize(){
for(var i=0;i<16;i++){
seqState.steps[i]=Math.random()<0.4;
seqVel[i]=0.5+Math.random()*0.5;
seqProb[i]=Math.random()<0.2?0.5:1.0;
seqRev[i]=Math.random()<0.15;
}
renderSeqAdvanced();
log("Seq randomized","ok");
}
// Clear sequencer
function seqClear(){
for(var i=0;i<16;i++){
seqState.steps[i]=false;
seqVel[i]=0.8;
seqProb[i]=1.0;
seqRev[i]=false;
seqPitch[i]=0;
}
renderSeqAdvanced();
log("Seq cleared","ok");
}
// Euclidean rhythm generator
function seqEuclidean(pulses,steps){
steps=steps||16;pulses=pulses||5;
var pattern=[];
var bucket=0;
for(var i=0;i<steps;i++){
bucket+=pulses;
if(bucket>=steps){
bucket-=steps;
pattern.push(true);
}else{
pattern.push(false);
}
}
for(var i=0;i<16;i++){
seqState.steps[i]=pattern[i%pattern.length];
}
renderSeqAdvanced();
log("Euclidean: "+pulses+"/"+steps,"ok");
}


// === MACROS (Commercial Grade) ===
function macroSpace(){
if(!AC)return;
if(nVerbMix)nVerbMix.gain.setTargetAtTime(.5,AC.currentTime,.05);
if(nDelayMix)nDelayMix.gain.setTargetAtTime(.4,AC.currentTime,.05);
if(nFilter)nFilter.frequency.setTargetAtTime(8000,AC.currentTime,.05);
log("MACRO: Space","ok");
}
function macroEnergy(){
if(!AC)return;
if(nDist)nDist.curve=distCurve(30);
if(master)master.gain.setTargetAtTime(Math.min(1,S.vol*1.2),AC.currentTime,.05);
if(nFilter)nFilter.frequency.setTargetAtTime(15000,AC.currentTime,.05);
log("MACRO: Energy","ok");
}
function macroTension(){
if(!AC)return;
if(nFilter){nFilter.frequency.setTargetAtTime(500,AC.currentTime,.05);nFilter.Q.value=8;}
log("MACRO: Tension","ok");
}
function macroReset(){
if(!AC)return;
if(nVerbMix)nVerbMix.gain.setTargetAtTime(S.fx.verb?S.fxP.revM:0,AC.currentTime,.05);
if(nDelayMix)nDelayMix.gain.setTargetAtTime(S.fx.delay?S.fxP.delayM:0,AC.currentTime,.05);
if(nDist)nDist.curve=distCurve(S.fx.dist?S.fxP.distD*100:0);
if(nFilter){nFilter.frequency.setTargetAtTime(S.fx.filter?S.fxP.filterF:20000,AC.currentTime,.05);nFilter.Q.value=0.7;}
if(master)master.gain.setTargetAtTime(S.vol,AC.currentTime,.05);
log("MACRO: Reset","ok");
}


// === PANIC: Stop everything ===
function panic(){
stop();
srcs.forEach(function(s){try{s.stop()}catch(e){}});
srcs=[];
log("PANIC: all audio stopped","er");
}


function renderSeq(){if(typeof renderSeqAdvanced==="function"){renderSeqAdvanced();}}

})();
