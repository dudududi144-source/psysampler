[test]
coverage = true
# NOTE: bun's coverageThreshold is PER-FILE (empirically proven 2026-09-05:
# overall 79.4% funcs / 81.6% lines still exits 1 at threshold 0.75 because
# ui.js sits at 25%) — so NO threshold here; the old fantasy 0.8 kept CI red
# on green suites. The honest overall floor lives in
# scripts/coverage-floor.mjs (`bun run coverage:floor`), which measures the
# All-files summary line itself and fails below 75%.
timeout = 10000

[install]
exact = false

[run]
watch = false
